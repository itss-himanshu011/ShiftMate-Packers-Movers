<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Thank You | ShiftMate Packers & Movers</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: 'Poppins', sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #f3f5ed 0%,
                    #ffffff 50%,
                    #eef1e3 100%
                );

        }


        .thankyou-wrap {

            width: 100%;

            max-width: 700px;

            background: #ffffff;

            padding: 50px 35px;

            border-radius: 24px;

            text-align: center;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.12);

            border: 1px solid #e5e8dc;

        }


        .success-icon {

            width: 90px;

            height: 90px;

            margin: 0 auto 25px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #eef1e3;

            color: #68743a;

            font-size: 42px;

            box-shadow:
                0 8px 25px rgba(104, 116, 58, 0.20);

        }


        h1 {

            margin: 0 0 12px;

            font-size: 42px;

            font-weight: 800;

            color: #68743a;

        }


        .main-message {

            margin: 0 auto 10px;

            color: #333;

            font-size: 18px;

            line-height: 1.7;

        }


        .sub-message {

            margin: 0 auto;

            color: #666;

            font-size: 15px;

            line-height: 1.7;

        }


        .highlight {

            color: #68743a;

            font-weight: 700;

        }


        .actions {

            margin-top: 30px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 14px;

            flex-wrap: wrap;

        }


        .action-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            padding: 13px 24px;

            border-radius: 10px;

            text-decoration: none;

            font-family: 'Poppins', sans-serif;

            font-size: 15px;

            font-weight: 600;

            transition: 0.3s ease;

        }


        .home-btn {

            background: #68743a;

            color: #ffffff;

        }


        .home-btn:hover {

            background: #505b2b;

            transform: translateY(-2px);

        }


        .call-btn {

            background: #25D366;

            color: #ffffff;

        }


        .call-btn:hover {

            background: #1ebe5d;

            transform: translateY(-2px);

        }


        .brand {

            margin-top: 30px;

            padding-top: 20px;

            border-top: 1px solid #eeeeee;

            color: #777;

            font-size: 13px;

        }


        .brand strong {

            color: #68743a;

        }


        @media (max-width: 600px) {

            .thankyou-wrap {

                padding: 40px 22px;

            }


            .success-icon {

                width: 75px;

                height: 75px;

                font-size: 34px;

            }


            h1 {

                font-size: 32px;

            }


            .main-message {

                font-size: 16px;

            }


            .actions {

                flex-direction: column;

            }


            .action-btn {

                width: 100%;

                max-width: 280px;

            }

        }

    </style>

</head>


<body>


    <!--
        IMPORTANT:

        This page should ONLY appear after
        a successful quote submission.

        If someone directly opens thankyou.html,
        they will be redirected to the contact section.
    -->

    <script>

        (function () {

            const submitted =
                sessionStorage.getItem(
                    "shiftmateSubmitted"
                );


            if (submitted !== "1") {

                window.location.replace(
                    "index.html#contact"
                );

                return;

            }


            /*
                Remove the flag after successful
                entry so the Thank You page cannot
                simply be reopened later.
            */

            sessionStorage.removeItem(
                "shiftmateSubmitted"
            );

        })();

    </script>


    <div class="thankyou-wrap">


        <!-- SUCCESS ICON -->

        <div class="success-icon">

            <i class="fa-solid fa-check"></i>

        </div>


        <!-- HEADING -->

        <h1>
            Thank You!
        </h1>


        <!-- MESSAGE -->

        <p class="main-message">

            Your enquiry has been submitted
            <strong>successfully.</strong>

        </p>


        <p class="sub-message">

            Our
            <span class="highlight">
                ShiftMate team
            </span>
            will contact you shortly.

        </p>


        <p class="sub-message">

            We appreciate your trust in
            choosing ShiftMate Packers & Movers.

        </p>


        <!-- BUTTONS -->

        <div class="actions">


            <a
                href="index.html"
                class="action-btn home-btn">

                <i class="fa-solid fa-house"></i>

                Back to Home

            </a>


            <a
                href="tel:+917318294180"
                class="action-btn call-btn">

                <i class="fa-solid fa-phone"></i>

                Call Us Now

            </a>


        </div>


        <!-- BRAND -->

        <div class="brand">

            <strong>
                ShiftMate Packers & Movers
            </strong>

            <br>

            Safe • Fast • Affordable

        </div>


    </div>


</body>

</html>
